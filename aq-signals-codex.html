<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advertiser Pulse — ChatGPT Advertising Concept</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
    <style>
      :root {
        --bg: #1c2033;
        --bg2: #232740;
        --bg3: #2a2f4a;
        --bg4: #30365a;
        --fg: #f0f2ff;
        --fg2: #a0a8cc;
        --border: #353d60;
        --primary: #f5bc42;
        --primary-fg: #1c2033;
        --risk: #e05555;
        --risk-light: rgba(224, 85, 85, 0.15);
        --opp: #3dba7e;
        --opp-light: rgba(61, 186, 126, 0.15);
        --urg-h: #e05555;
        --urg-m: #f5bc42;
        --urg-l: #5a6a99;
        --radius: 6px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family:
          -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
        font-size: 14px;
        height: 100vh;
        overflow: hidden;
      }
      button {
        cursor: pointer;
        border: none;
        background: none;
        color: inherit;
        font: inherit;
      }
      input,
      textarea {
        font: inherit;
        color: inherit;
        background: none;
        outline: none;
      }
      a {
        color: var(--primary);
      }
      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-thumb {
        background: #444;
        border-radius: 4px;
      }

      /* Layout */
      .app {
        display: flex;
        height: 100vh;
        overflow: hidden;
      }

      /* Sidebar */
      .sidebar {
        width: 272px;
        min-width: 272px;
        background: var(--bg2);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      .sidebar-header {
        padding: 16px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .logo-icon {
        width: 32px;
        height: 32px;
        border-radius: var(--radius);
        background: var(--primary);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--primary-fg);
        font-size: 16px;
        flex-shrink: 0;
      }
      .logo-text {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .logo-sub {
        font-size: 10px;
        color: var(--fg2);
        margin-top: -1px;
      }
      .search-wrap {
        padding: 12px;
      }
      .search-input {
        width: 100%;
        padding: 7px 10px 7px 28px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--bg);
        font-size: 13px;
        color: var(--fg);
        position: relative;
      }
      .search-wrap {
        position: relative;
        padding: 12px;
      }
      .search-wrap .search-icon {
        position: absolute;
        left: 22px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--fg2);
        font-size: 12px;
        pointer-events: none;
      }
      .filter-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        padding: 0 12px 12px;
      }
      .chip {
        font-size: 10px;
        padding: 3px 8px;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        color: var(--fg2);
        transition: all 0.15s;
      }
      .chip:hover {
        color: var(--fg);
        background: var(--bg3);
      }
      .chip.active {
        background: var(--primary);
        color: var(--primary-fg);
        border-color: var(--primary);
      }
      .account-list {
        flex: 1;
        overflow-y: auto;
        padding-bottom: 16px;
      }
      .account-btn {
        width: 100%;
        text-align: left;
        padding: 10px 16px;
        border-left: 2px solid transparent;
        transition: all 0.15s;
        display: flex;
        align-items: flex-start;
        gap: 8px;
      }
      .account-btn:hover {
        background: rgba(255, 255, 255, 0.04);
      }
      .account-btn.active {
        background: var(--bg3);
        border-left-color: var(--primary);
      }
      .account-avatar {
        width: 32px;
        height: 32px;
        border-radius: var(--radius);
        background: var(--bg);
        border: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 600;
        color: var(--primary);
        flex-shrink: 0;
      }
      .account-name {
        font-size: 13px;
        font-weight: 500;
      }
      .account-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 3px;
        margin-top: 3px;
      }
      .badge {
        font-size: 10px;
        padding: 1px 6px;
        border-radius: 4px;
        font-weight: 500;
      }
      .badge-client {
        background: var(--opp-light);
        color: var(--opp);
      }
      .badge-prospect {
        background: rgba(245, 188, 66, 0.15);
        color: var(--primary);
      }
      .badge-churn {
        background: var(--risk-light);
        color: var(--risk);
      }
      .badge-muted {
        background: rgba(255, 255, 255, 0.07);
        color: var(--fg2);
      }
      .badge-high {
        background: rgba(224, 85, 85, 0.2);
        color: var(--urg-h);
        font-weight: 700;
      }
      .acct-name-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      /* Middle feed */
      .feed {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
        background: var(--bg);
      }
      .feed-header {
        padding: 20px 24px 16px;
        border-bottom: 1px solid var(--border);
      }
      .feed-title-row {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .feed-title {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .feed-description {
        font-size: 12px;
        color: var(--fg2);
        margin-top: 4px;
      }
      .feed-contact {
        font-size: 11px;
        color: var(--fg2);
        margin-top: 4px;
      }
      .feed-contact strong {
        color: var(--fg);
      }
      .stats-row {
        display: flex;
        gap: 6px;
        margin-top: 12px;
        flex-wrap: wrap;
      }
      .stat-tile {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--bg2);
        font-size: 11px;
      }
      .stat-tile.high {
        border-color: rgba(224, 85, 85, 0.4);
      }
      .stat-icon {
        font-size: 12px;
        color: var(--fg2);
      }
      .stat-icon.high {
        color: var(--urg-h);
      }
      .stat-label {
        color: var(--fg2);
      }
      .stat-val {
        font-size: 12px;
        font-weight: 600;
      }
      .stat-val.high {
        color: var(--urg-h);
      }
      .filter-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        padding: 10px 24px;
        border-bottom: 1px solid var(--border);
        overflow: hidden;
      }
      .filter-btn {
        font-size: 10px;
        padding: 4px 10px;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        color: var(--fg2);
        transition: all 0.15s;
        flex-shrink: 0;
      }
      .filter-btn:hover {
        color: var(--fg);
        background: var(--bg2);
      }
      .filter-btn.active {
        background: var(--primary);
        color: var(--primary-fg);
        border-color: var(--primary);
      }
      .signal-list {
        flex: 1;
        overflow-y: auto;
        padding: 16px 24px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .signal-card {
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg2);
        padding: 14px 16px;
        transition: all 0.15s;
      }
      .signal-card:hover {
        border-color: rgba(255, 255, 255, 0.15);
        background: var(--bg3);
      }
      .signal-card.active {
        border-color: rgba(245, 188, 66, 0.5);
        background: var(--bg3);
      }
      .sig-top {
        display: flex;
        align-items: flex-start;
        gap: 12px;
      }
      .sig-icon {
        width: 36px;
        height: 36px;
        border-radius: var(--radius);
        background: var(--bg);
        border: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        flex-shrink: 0;
      }
      .sig-content {
        flex: 1;
        min-width: 0;
      }
      .sig-meta {
        font-size: 10px;
        color: var(--fg2);
        display: flex;
        align-items: center;
        gap: 4px;
        flex-wrap: wrap;
      }
      .sig-meta .sig-type {
        font-weight: 600;
        color: var(--fg);
      }
      .sig-desc {
        font-size: 12px;
        color: rgba(240, 242, 255, 0.9);
        margin-top: 5px;
        line-height: 1.55;
      }
      .sig-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 10px;
        gap: 8px;
      }
      .sig-badges {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .badge-risk {
        background: var(--risk-light);
        color: var(--risk);
        font-size: 10px;
        padding: 1px 6px;
        border-radius: 4px;
        font-weight: 500;
      }
      .badge-opp {
        background: var(--opp-light);
        color: var(--opp);
        font-size: 10px;
        padding: 1px 6px;
        border-radius: 4px;
        font-weight: 500;
      }
      .badge-urgency {
        font-size: 10px;
        padding: 1px 6px;
        border-radius: 4px;
        border: 1px solid;
        font-weight: 500;
      }
      .badge-urg-h {
        color: var(--urg-h);
        border-color: rgba(224, 85, 85, 0.4);
        background: rgba(224, 85, 85, 0.1);
      }
      .badge-urg-m {
        color: var(--urg-m);
        border-color: rgba(245, 188, 66, 0.4);
        background: rgba(245, 188, 66, 0.1);
      }
      .badge-urg-l {
        color: var(--urg-l);
        border-color: rgba(90, 106, 153, 0.4);
        background: rgba(90, 106, 153, 0.1);
      }
      .sig-actions {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .outreach-btn {
        font-size: 10px;
        padding: 4px 10px;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        color: var(--fg2);
        transition: all 0.15s;
      }
      .outreach-btn:hover {
        color: var(--primary);
        border-color: rgba(245, 188, 66, 0.5);
      }
      .checkbox-wrap {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 10px;
        color: var(--fg2);
      }
      .checkbox-wrap input[type="checkbox"] {
        cursor: pointer;
        accent-color: var(--primary);
      }
      .feed-empty {
        text-align: center;
        color: var(--fg2);
        padding: 48px 0;
        font-size: 13px;
      }
      .multi-btn-row {
        padding: 10px 24px;
        border-top: 1px solid var(--border);
        display: flex;
        justify-content: flex-end;
      }
      .multi-btn {
        font-size: 12px;
        padding: 6px 14px;
        border-radius: var(--radius);
        background: var(--primary);
        color: var(--primary-fg);
        font-weight: 600;
        transition: opacity 0.15s;
      }
      .multi-btn:hover {
        opacity: 0.85;
      }

      /* Contract bar */
      .contract-bar-wrap {
        margin-top: 12px;
      }
      .contract-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 10px;
        color: var(--fg2);
        margin-bottom: 4px;
      }
      .contract-bar {
        height: 4px;
        background: var(--bg3);
        border-radius: 2px;
        overflow: hidden;
      }
      .contract-fill {
        height: 100%;
        border-radius: 2px;
        transition: width 0.4s;
      }
      .contract-fill.pace-ok {
        background: var(--opp);
      }
      .contract-fill.pace-warn {
        background: var(--urg-m);
      }
      .contract-fill.pace-risk {
        background: var(--risk);
      }
      .contract-renewal {
        font-size: 10px;
        color: var(--fg2);
        margin-top: 3px;
      }

      /* Empty state */
      .empty-state {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: var(--fg2);
        gap: 8px;
      }
      .empty-logo {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        background: var(--primary);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        color: var(--primary-fg);
      }
      .empty-title {
        font-size: 15px;
        font-weight: 600;
        color: var(--fg);
      }
      .empty-sub {
        font-size: 13px;
      }

      /* Right panel */
      .panel {
        width: 380px;
        min-width: 380px;
        background: var(--bg2);
        border-left: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }
      .panel-header {
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .panel-title-sub {
        font-size: 11px;
        color: var(--fg2);
      }
      .panel-title {
        font-size: 13px;
        font-weight: 600;
      }
      .panel-actions {
        display: flex;
        align-items: center;
        gap: 2px;
      }
      .icon-btn {
        width: 28px;
        height: 28px;
        border-radius: var(--radius);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--fg2);
        transition: all 0.15s;
        font-size: 14px;
      }
      .icon-btn:hover {
        color: var(--fg);
        background: var(--bg3);
      }
      .panel-body {
        flex: 1;
        overflow-y: auto;
        padding: 16px 20px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      /* Outreach panel sections */
      .section-title-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 8px;
      }
      .section-icon {
        font-size: 12px;
        color: var(--primary);
      }
      .section-label {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-weight: 600;
        color: var(--fg2);
      }
      .signal-preview {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 10px 12px;
      }
      .signal-preview-meta {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        color: var(--fg2);
        margin-bottom: 4px;
      }
      .signal-preview-meta strong {
        color: var(--fg);
      }
      .signal-preview p {
        font-size: 11px;
        color: rgba(240, 242, 255, 0.8);
        line-height: 1.5;
      }
      .angle-text {
        font-size: 12px;
        line-height: 1.6;
        color: rgba(240, 242, 255, 0.9);
      }
      .email-field-label {
        font-size: 10px;
        color: var(--fg2);
        margin-bottom: 4px;
      }
      .email-input {
        width: 100%;
        background: transparent;
        font-size: 12px;
        border: 0;
        border-bottom: 1px solid transparent;
        padding: 4px 0;
        transition: border-color 0.15s;
      }
      .email-input:focus {
        border-bottom-color: rgba(245, 188, 66, 0.5);
        outline: none;
      }
      .email-body {
        width: 100%;
        background: transparent;
        font-size: 11px;
        line-height: 1.6;
        border: 1px solid transparent;
        border-radius: var(--radius);
        padding: 8px;
        resize: none;
        transition: border-color 0.15s;
        min-height: 180px;
        white-space: pre-wrap;
      }
      .email-body:focus {
        border-color: rgba(245, 188, 66, 0.5);
        outline: none;
      }
      .email-field-label {
        margin-top: 10px;
      }
      .email-field-label:first-child {
        margin-top: 0;
      }
      .btn-row {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-top: 10px;
      }
      .btn-primary {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-size: 13px;
        font-weight: 600;
        padding: 8px 16px;
        border-radius: var(--radius);
        background: var(--primary);
        color: var(--primary-fg);
        transition: opacity 0.15s;
        text-decoration: none;
      }
      .btn-primary:hover {
        opacity: 0.85;
      }
      .btn-secondary {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-size: 13px;
        font-weight: 500;
        padding: 7px 16px;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        color: var(--fg);
        transition: all 0.15s;
      }
      .btn-secondary:hover {
        border-color: rgba(245, 188, 66, 0.5);
        color: var(--primary);
      }
      .talking-pts {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .talking-pts li {
        display: flex;
        gap: 8px;
        font-size: 12px;
        line-height: 1.55;
        color: rgba(240, 242, 255, 0.9);
      }
      .talking-pts li .dot {
        color: var(--primary);
        margin-top: 1px;
        flex-shrink: 0;
      }
      .value-props {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .value-props li {
        display: flex;
        gap: 6px;
        font-size: 11px;
        color: var(--fg2);
        line-height: 1.5;
      }
      .value-props li .arrow {
        color: var(--primary);
        flex-shrink: 0;
      }

      /* Intel panel */
      .poc-card {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .poc-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
      }
      .poc-name {
        font-size: 13px;
        font-weight: 600;
      }
      .poc-role {
        font-size: 11px;
        color: var(--fg2);
        margin-top: 1px;
      }
      .poc-tenure {
        font-size: 10px;
        color: var(--fg2);
      }
      .sentiment-badge {
        font-size: 10px;
        padding: 2px 8px;
        border-radius: 4px;
        border: 1px solid;
        font-weight: 500;
        flex-shrink: 0;
      }
      .sentiment-warm {
        color: #3dba7e;
        border-color: rgba(61, 186, 126, 0.3);
        background: rgba(61, 186, 126, 0.1);
      }
      .sentiment-neutral {
        color: var(--fg2);
        border-color: var(--border);
        background: rgba(255, 255, 255, 0.04);
      }
      .sentiment-cooling {
        color: #f5bc42;
        border-color: rgba(245, 188, 66, 0.3);
        background: rgba(245, 188, 66, 0.1);
      }
      .poc-lines {
        display: flex;
        flex-direction: column;
        gap: 5px;
        font-size: 11px;
        line-height: 1.5;
      }
      .poc-line {
        color: rgba(240, 242, 255, 0.8);
      }
      .poc-line strong {
        color: var(--fg);
      }
      .poc-quote {
        border-left: 2px solid rgba(245, 188, 66, 0.5);
        padding: 3px 8px;
        font-style: italic;
        color: rgba(240, 242, 255, 0.85);
        font-size: 11px;
      }
      .dynamics-box {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 12px;
        font-size: 11px;
        line-height: 1.6;
        color: rgba(240, 242, 255, 0.85);
      }
      .integration-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 8px 12px;
      }
      .int-left {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .int-name {
        font-size: 12px;
        font-weight: 500;
      }
      .int-sync {
        font-size: 10px;
        color: var(--fg2);
      }
      .int-connected {
        font-size: 10px;
        padding: 2px 8px;
        border-radius: 4px;
        border: 1px solid rgba(61, 186, 126, 0.4);
        background: rgba(61, 186, 126, 0.1);
        color: #3dba7e;
        font-weight: 500;
      }
      .intel-section-label {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--fg2);
        font-weight: 600;
        margin-bottom: 8px;
      }
      .intel-section {
        display: flex;

              "strong",
              null,
              monthly
                ? "Spend against approved monthly budget"
                : "Spend against approved starter-test budget",
            ),
            badge("Approved", "badge-client"),
          ),
          h(
            "div",
            { className: "budget-period" },
            period + " · Sample snapshot " + dateLabel(agreement.snapshot),

          h(
            "div",
            { className: "budget-stats" },
            h(
              "div",
              null,
              h("span", null, "Spent"),
              h("strong", { className: "budget-spent" }, money(a.spend)),

            h(
              "div",
              null,
              h("span", null, "Approved budget"),
              h("strong", { className: "budget-approved" }, money(total)),

            h(

              null,

                " approved (" +

                "%)",

            h("div", {
              className: "budget-fill" + (over ? " budget-over-fill" : ""),
              style: { width: Math.min(100, pct) + "%" },

          ),
          h("p", { className: "budget-pacing" }, pacing),
          projection !== null &&
            h(
              "p",
              { className: "budget-note" },
              "At the current average rate: " +
                money(projection) +
                " by period end. This estimate does not change the approved budget.",

          expansion &&
            h(
              "div",
              { className: "approved-expansion" },

                "div",
                { className: "budget-title-row" },
                h("strong", null, "Approved expansion"),
                badge("+" + money(expansion.amount), "badge-client"),

              h(
                "p",
                null,
                money(a.budget) +
                  " original + " +
                  money(expansion.amount) +
                  " approved increase = " +
                  money(total) +
                  " current budget",

              h(

                null,
                "Approved by " +
                  expansion.approvedBy +

                  dateLabel(expansion.approvedOn) +

                  dateLabel(expansion.effectiveOn),

          h(
            "details",
            { className: "approval-details" },
            h("summary", null, "Budget approval details"),
            h(
              "p",

              "Original budget " +
                money(a.budget) +
                " approved by " +
                agreement.approvedBy +
                " on " +
                dateLabel(agreement.approvedOn) +
                ".",
            ),
          ),
        );
      }
      function UpsellProposal({ account: a }) {
        const proposal = a.upsellProposal;
        const total = approvedBudget(a);
        return h(
          "div",
          { className: "opportunity-card" },
          h(
            "div",
            { className: "opportunity-kicker" },
            "Potential incremental spend · " + proposal.period,
          ),
          h(
            "div",
            { className: "opportunity-value" },
            "+" + money(proposal.amount),
            h(
              "span",
              { className: "badge badge-prospect", style: { marginLeft: 8 } },
              "Proposed; not approved",
            ),
          ),
          h("p", { className: "opportunity-summary" }, proposal.rationale),
          h(
            "p",
            { className: "opportunity-gate" },
            "Before approval: " + proposal.gate,
          ),
          h(
            "p",
            { className: "opportunity-summary" },
            "Current approved budget stays at " +
              money(total) +
              ". If approved for this period, the total would become " +
              money(total + proposal.amount) +

      function SpendOpportunity({ account: a }) {
        if (a.upsellProposal) return h(UpsellProposal, { account: a });
        if (!a.spendOpportunity) return null;
        const opportunity = a.spendOpportunity;
        return h(
          "div",
          { className: "opportunity-card" },
          h(
            "div",
            { className: "opportunity-kicker" },
            "Proposed next-test budget · " + opportunity.horizon,
          ),
          h(
            "div",
            { className: "opportunity-value" },
            money(opportunity.low) + "–" + money(opportunity.high),
            h(
              "span",
              { className: "badge badge-prospect", style: { marginLeft: 8 } },
              "Proposed; not approved",
            ),
          ),
          h("p", { className: "opportunity-summary" }, opportunity.drivers),
          h(
            "p",
            { className: "opportunity-summary" },
            "Total budget proposed for a separate future test. The current approved starter budget remains " +
              money(approvedBudget(a)) +
              ".",
          ),
          h(
            "p",
            { className: "opportunity-summary" },
            h("strong", null, "Funding: "),
            a.funding,
          ),
          h(
            "p",
            { className: "opportunity-gate" },
            "Before more spend: " + opportunity.gate,
          ),
          h(
            "p",
            { className: "opportunity-footnote" },
            "Illustrative AM proposal. Company signals indicate a conversation opportunity; no campaign results or budget allocation are implied.",

        );
      }
      function Feed({ account: a, onDraft, onIntel, panelKind }) {
        const [filter, setFilter] = useState("All"),
          [checked, setChecked] = useState({});
        const list = signals
          .filter((s) => s.accountId === a.id)
          .sort((x, y) => x.age - y.age);
        const visible = list.filter(
          (s) =>
            filter === "All" ||
            s.type === filter ||
            s.classification === filter,
        );
        const selected = list.filter((s) => checked[s.id]);
        return h(
          "section",
          { className: "feed" },
          h(
            "div",
            { className: "feed-header" },
            h(
              "div",
              { className: "feed-title-row" },
              h("span", { className: "feed-title" }, a.name),
              badge(a.status, "badge-client"),
              ...a.tags.map((t) =>
                h(
                  "span",
                  {
                    key: t,
                    className:
                      "badge " +
                      (t === "Needs attention" ? "badge-churn" : "badge-muted"),
                  },
                  t,
                ),
              ),
              h(
                "button",
                {
                  className:
                    "intel-btn" + (panelKind === "intel" ? " active" : ""),
                  onClick: onIntel,
                  style: { marginLeft: "auto" },
                },
                "👤 Account context",
              ),
            ),
            h("div", { className: "feed-description" }, a.description),
            h(
              "div",
              { className: "feed-contact" },
              h("strong", null, a.contactName),
              " · " + a.contactRole,
            ),
            h(
              "div",
              { className: "stats-row" },
              tile(
                a.budgetAgreement.kind === "Monthly"
                  ? "Spend MTD"
                  : "Test spend",
                money(a.spend),
                "💰",
              ),
              tile(
                "Approved budget",
                approvedBudget(a) === null ? "—" : money(approvedBudget(a)),
                "◎",
              ),
              tile(a.objective, String(a.conversions), "↗"),
              tile(
                a.onboardedDays != null ? "CPA (early)" : "CPA",
                cpa(a) === null ? "—" : money(cpa(a)),
                "🎯",
              ),
              tile("CPA goal", money(a.cpaGoal), "◎"),
              tile("Campaigns", a.campaigns, "▤"),
            ),
            h(AccountQuota, { account: a }),
            h(BudgetBar, { account: a }),
            h(SpendOpportunity, { account: a }),
            h(
              "div",
              { className: "feed-contact" },
              "Sample data · Budget consumed measures spend; review CPA and outcome quality alongside it.",
            ),
          ),
          h(
            "div",
            { className: "filter-bar" },
            ["All", "Risk", "Opportunity", ...SIGNAL_TYPES].map((f) =>
              h(
                "button",
                {
                  key: f,
                  className: "filter-btn" + (filter === f ? " active" : ""),
                  onClick: () => setFilter(f),
                },
                (EMOJI[f] ? EMOJI[f] + " " : "") + f,
              ),
            ),
          ),
          h(
            "div",
            { className: "signal-list" },
            !visible.length &&
              h(
                "div",
                { className: "feed-empty" },
                "No signals match this filter.",
              ),
            visible.map((s) =>
              h(
                "article",
                {
                  key: s.id,
                  className: "signal-card" + (checked[s.id] ? " active" : ""),
                },
                h(
                  "div",
                  { className: "sig-top" },
                  h("div", { className: "sig-icon" }, EMOJI[s.type]),
                  h(
                    "div",
                    { className: "sig-content" },
                    h(
                      "div",
                      { className: "sig-meta" },
                      h("strong", { className: "sig-type" }, s.type),
                      " · " +
                        s.source +
                        " · " +
                        (s.age === 1 ? "yesterday" : s.age + "d ago"),
                    ),
                    h("p", { className: "sig-desc" }, s.description),
                    h(
                      "div",
                      { className: "sig-footer" },
                      h(
                        "div",
                        { className: "sig-badges" },
                        h(
                          "span",
                          {
                            className:
                              s.classification === "Risk"
                                ? "badge-risk"
                                : "badge-opp",
                          },
                          s.classification,
                        ),
                        h(
                          "span",
                          {
                            className:
                              "badge-urgency " + urgencyClass(s.urgency),
                          },
                          s.urgency,
                        ),
                      ),
                      h(
                        "div",
                        { className: "sig-actions" },
                        h(
                          "label",
                          { className: "checkbox-wrap" },
                          h("input", {
                            type: "checkbox",
                            checked: !!checked[s.id],
                            onChange: (e) =>
                              setChecked({
                                ...checked,
                                [s.id]: e.target.checked,
                              }),
                          }),
                          "Select",
                        ),
                        h(
                          "button",
                          {
                            className: "outreach-btn",
                            onClick: () => onDraft([s.id]),
                          },
                          "Plan & outreach ↗",
                        ),
                      ),
                    ),
                  ),
                ),
              ),
            ),
          ),
          selected.length > 0 &&
            h(
              "div",
              { className: "multi-btn-row" },
              h(
                "button",
                {
                  className: "multi-btn",
                  onClick: () => {
                    onDraft(selected.map((s) => s.id));
                    setChecked({});
                  },
                },
                "Combined plan (" +
                  selected.length +
                  " signal" +
                  (selected.length === 1 ? "" : "s") +
                  ") ↗",
              ),
            ),
        );
      }
      async function copyText(text) {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return;
        }
        const el = document.createElement("textarea");
        el.value = text;
        el.style.position = "fixed";
        el.style.opacity = "0";
        document.body.appendChild(el);
        el.select();
        const ok = document.execCommand("copy");
        el.remove();
        if (!ok) throw new Error("Copy unavailable");
      }
      function PlanPanel({ account: a, ids, onClose }) {
        const selected = ids
          .map((id) => signals.find((s) => s.id === id))
          .filter(Boolean);
        const base = useMemo(
          () => draftFor(a, selected),
          [a.id, ids.join(",")],
        );
        const [to, setTo] = useState(a.contactEmail),
          [subject, setSubject] = useState(base.subject),
          [body, setBody] = useState(base.body),
          [copyState, setCopyState] = useState("");
        useEffect(() => {
          setTo(a.contactEmail);
          setSubject(base.subject);
          setBody(base.body);
          setCopyState("");
        }, [a.id, base]);
        const reset = () => {
          setTo(a.contactEmail);
          setSubject(base.subject);
          setBody(base.body);
          setCopyState("");
        };
        const mailto =
          "mailto:" +
          encodeURIComponent(to) +
          "?subject=" +
          encodeURIComponent(subject) +
          "&body=" +
          encodeURIComponent(body);
        return h(
          "aside",
          { className: "panel fade-in" },
          h(
            "div",
            { className: "panel-header" },
            h(
              "div",
              null,
              h(
                "div",
                { className: "panel-title-sub" },
                selected.length > 1
                  ? "Combined plan · " + selected.length + " signals"
                  : "Action plan & outreach",
              ),
              h("div", { className: "panel-title" }, a.name),
            ),
            h(
              "div",
              { className: "panel-actions" },
              h(
                "button",
                {
                  className: "icon-btn",
                  title: "Reset",
                  "aria-label": "Reset draft",
                  onClick: reset,
                },
                "↺",
              ),
              h(
                "button",
                {
                  className: "icon-btn",
                  title: "Close",
                  "aria-label": "Close panel",
                  onClick: onClose,
                },
                "×",
              ),
            ),
          ),
          h(
            "div",
            { className: "panel-body" },
            ...selected.map((s) =>
              h(
                "div",
                { key: s.id, className: "signal-preview" },
                h(
                  "div",
                  { className: "signal-preview-meta" },
                  EMOJI[s.type] + " ",
                  h("strong", null, s.type),
                  " · " + s.classification,
                ),
                h("p", null, s.description),
              ),
            ),
            h(
              "div",
              null,
              h(
                "div",
                { className: "section-title-row" },
                h(
                  "span",
                  { className: "section-label" },
                  "Recommended AM action",
                ),
              ),
              h("p", { className: "angle-text" }, base.angle),
            ),
            h(
              "div",
              null,
              h(
                "div",
                { className: "section-title-row" },
                h(
                  "span",
                  { className: "section-label" },
                  "Draft advertiser email",
                ),
              ),
              h(
                "label",
                { className: "email-field-label", htmlFor: "draft-to" },
                "To",
              ),
              h("input", {
                id: "draft-to",
                className: "email-input",
                value: to,
                onChange: (e) => setTo(e.target.value),
              }),
              h(
                "label",
                { className: "email-field-label", htmlFor: "draft-subject" },
                "Subject",
              ),
              h("input", {
                id: "draft-subject",
                className: "email-input",
                value: subject,
                onChange: (e) => setSubject(e.target.value),
              }),
              h(
                "label",
                { className: "email-field-label", htmlFor: "draft-body" },
                "Body",
              ),
              h("textarea", {
                id: "draft-body",
                className: "email-body",
                value: body,
                onChange: (e) => setBody(e.target.value),
                rows: 16,
              }),
              h(
                "div",
                { className: "btn-row" },
                h(
                  "a",
                  { className: "btn-primary", href: mailto },
                  "Open email app ↗",
                ),
                h(
                  "button",
                  {
                    className: "btn-secondary",
                    onClick: async () => {
                      try {
                        await copyText(
                          "To: " + to + "\nSubject: " + subject + "\n\n" + body,
                        );
                        setCopyState("Copied");
                      } catch {
                        setCopyState("Select and copy the draft manually.");
                      }
                    },
                  },
                  "Copy email",
                ),
              ),
              h("p", { className: "copy-status", role: "status" }, copyState),
              h(
                "p",
                { className: "logo-sub" },
                "Sample contact uses an .example address. Replace it before sending.",
              ),
            ),
            h(
              "div",
              null,
              h(
                "div",
                { className: "section-title-row" },
                h("span", { className: "section-label" }, "Review checklist"),
              ),
              h(
                "ul",
                { className: "talking-pts" },
                base.steps.map((s, i) =>
                  h("li", { key: i }, h("span", { className: "dot" }, "•"), s),
                ),
              ),
            ),
          ),
        );
      }
      function ContextPanel({ account: a, onClose }) {
        return h(
          "aside",
          { className: "panel fade-in" },
          h(
            "div",
            { className: "panel-header" },
            h(
              "div",
              null,
              h("div", { className: "panel-title-sub" }, "Account context"),
              h("div", { className: "panel-title" }, a.name),
            ),
            h(
              "button",
              { className: "icon-btn", title: "Close", onClick: onClose },
              "×",
            ),
          ),
          h(
            "div",
            { className: "panel-body" },
            h(AccountQuota, { account: a }),
            h(SpendOpportunity, { account: a }),
            h(
              "div",
              null,
              h(
                "div",
                { className: "intel-section-label" },
                "Success criteria",
              ),
              h(
                "div",
                { className: "dynamics-box" },
                h("p", null, a.objective + " · CPA goal " + money(a.cpaGoal)),
                h("p", { style: { marginTop: 8 } }, a.renewal),
              ),
            ),
            h(
              "div",
              { className: "intel-section" },
              h("div", { className: "intel-section-label" }, "Stakeholders"),
              a.stakeholders.map(([name, role, authority, goal, tip]) =>
                h(
                  "div",
                  { key: name, className: "poc-card" },
                  h(
                    "div",
                    { className: "poc-top" },
                    h(
                      "div",
                      null,
                      h("div", { className: "poc-name" }, name),
                      h("div", { className: "poc-role" }, role),
                    ),
                    badge(authority),
                  ),
                  h(
                    "div",
                    { className: "poc-lines" },
                    h(
                      "div",
                      { className: "poc-line" },
                      h("strong", null, "Priority: "),
                      goal,
                    ),
                    h(
                      "div",
                      { className: "poc-line" },
                      h("strong", null, "AM approach: "),
                      tip,
                    ),
                  ),
                ),
              ),
            ),
            h(
              "div",
              null,
              h(
                "div",
                { className: "intel-section-label" },
                "Account strategy",
              ),
              h("p", { className: "dynamics-box" }, a.context),
            ),
            h(
              "div",
              null,
              h(
                "div",
                { className: "intel-section-label" },
                "Reporting inputs",
              ),
              [
                "Performance report",
                "Budget plan",
                "Conversion audit",
                "Creative brief",
                "Account notes",
              ].map((name) =>
                h(
                  "div",
                  {
                    key: name,
                    className: "integration-row",
                    style: { marginBottom: 6 },
                  },
                  h("span", { className: "int-name" }, name),
                  badge("Sample"),
                ),
              ),
              h(
                "p",
                { className: "logo-sub" },
                "Illustrative inputs. No services are connected.",
              ),
            ),
          ),
        );
      }
      function App() {
        const [selectedId, setSelectedId] = useState(accounts[0].id),
          [panel, setPanel] = useState(null);
        const account = accounts.find((a) => a.id === selectedId);
        return h(
          "div",
          { className: "quota-dashboard" },
          h(QuotaSummary),
          h(
            "div",
            { className: "app" },
            h(Sidebar, {
              selectedId,
              onSelect: (id) => {
                setSelectedId(id);
                setPanel(null);
              },
            }),
            h(Feed, {
              key: account.id,
              account,
              panelKind: panel?.kind,
              onDraft: (ids) => setPanel({ kind: "plan", ids }),
              onIntel: () =>
                setPanel(panel?.kind === "intel" ? null : { kind: "intel" }),
            }),
            panel &&
              (panel.kind === "plan"
                ? h(PlanPanel, {
                    account,
                    ids: panel.ids,
                    onClose: () => setPanel(null),
                  })
                : h(ContextPanel, { account, onClose: () => setPanel(null) })),
          ),
        );
      }
      ReactDOM.createRoot(document.getElementById("root")).render(h(App));
    </script>
  </body>
</html>
