<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AQ Account Pulse — Customer Intelligence</title>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<style>
:root {
  --bg: #1c2033;
  --bg2: #232740;
  --bg3: #2a2f4a;
  --bg4: #30365a;
  --fg: #f0f2ff;
  --fg2: #a0a8cc;
  --border: #353d60;
  --primary: #f5bc42;
  --primary-fg: #1c2033;
  --risk: #e05555;
  --risk-light: rgba(224,85,85,0.15);
  --opp: #3dba7e;
  --opp-light: rgba(61,186,126,0.15);
  --urg-h: #e05555;
  --urg-m: #f5bc42;
  --urg-l: #5a6a99;
  --radius: 6px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; font-size: 14px; height: 100vh; overflow: hidden; }
button { cursor: pointer; border: none; background: none; color: inherit; font: inherit; }
input, textarea { font: inherit; color: inherit; background: none; outline: none; }
a { color: var(--primary); }
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }

/* Layout */
.app { display: flex; height: 100vh; overflow: hidden; }

/* Sidebar */
.sidebar { width: 272px; min-width: 272px; background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; height: 100vh; }
.sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
.logo-icon { width: 32px; height: 32px; border-radius: var(--radius); background: var(--primary); display: flex; align-items: center; justify-content: center; color: var(--primary-fg); font-size: 16px; flex-shrink: 0; }
.logo-text { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
.logo-sub { font-size: 10px; color: var(--fg2); margin-top: -1px; }
.search-wrap { padding: 12px; }
.search-input { width: 100%; padding: 7px 10px 7px 28px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); font-size: 13px; color: var(--fg); position: relative; }
.search-wrap { position: relative; padding: 12px; }
.search-wrap .search-icon { position: absolute; left: 22px; top: 50%; transform: translateY(-50%); color: var(--fg2); font-size: 12px; pointer-events: none; }
.filter-chips { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 12px 12px; }
.chip { font-size: 10px; padding: 3px 8px; border-radius: var(--radius); border: 1px solid var(--border); color: var(--fg2); transition: all 0.15s; }
.chip:hover { color: var(--fg); background: var(--bg3); }
.chip.active { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
.account-list { flex: 1; overflow-y: auto; padding-bottom: 16px; }
.account-btn { width: 100%; text-align: left; padding: 10px 16px; border-left: 2px solid transparent; transition: all 0.15s; display: flex; align-items: flex-start; gap: 8px; }
.account-btn:hover { background: rgba(255,255,255,0.04); }
.account-btn.active { background: var(--bg3); border-left-color: var(--primary); }
.account-avatar { width: 32px; height: 32px; border-radius: var(--radius); background: var(--bg); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: var(--primary); flex-shrink: 0; }
.account-name { font-size: 13px; font-weight: 500; }
.account-tags { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 3px; }
.badge { font-size: 10px; padding: 1px 6px; border-radius: 4px; font-weight: 500; }
.badge-client { background: var(--opp-light); color: var(--opp); }
.badge-prospect { background: rgba(245,188,66,0.15); color: var(--primary); }
.badge-churn { background: var(--risk-light); color: var(--risk); }
.badge-muted { background: rgba(255,255,255,0.07); color: var(--fg2); }
.badge-high { background: rgba(224,85,85,0.2); color: var(--urg-h); font-weight: 700; }
.acct-name-row { display: flex; align-items: center; gap: 6px; }

/* Middle feed */
.feed { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; background: var(--bg); }
.feed-header { padding: 20px 24px 16px; border-bottom: 1px solid var(--border); }
.feed-title-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.feed-title { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
.feed-description { font-size: 12px; color: var(--fg2); margin-top: 4px; }
.feed-contact { font-size: 11px; color: var(--fg2); margin-top: 4px; }
.feed-contact strong { color: var(--fg); }
.stats-row { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
.stat-tile { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg2); font-size: 11px; }
.stat-tile.high { border-color: rgba(224,85,85,0.4); }
.stat-icon { font-size: 12px; color: var(--fg2); }
.stat-icon.high { color: var(--urg-h); }
.stat-label { color: var(--fg2); }
.stat-val { font-size: 12px; font-weight: 600; }
.stat-val.high { color: var(--urg-h); }
.filter-bar { display: flex; flex-wrap: wrap; gap: 4px; padding: 10px 24px; border-bottom: 1px solid var(--border); overflow: hidden; }
.filter-btn { font-size: 10px; padding: 4px 10px; border-radius: var(--radius); border: 1px solid var(--border); color: var(--fg2); transition: all 0.15s; flex-shrink: 0; }
.filter-btn:hover { color: var(--fg); background: var(--bg2); }
.filter-btn.active { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
.signal-list { flex: 1; overflow-y: auto; padding: 16px 24px; display: flex; flex-direction: column; gap: 10px; }
.signal-card { border: 1px solid var(--border); border-radius: 8px; background: var(--bg2); padding: 14px 16px; transition: all 0.15s; }
.signal-card:hover { border-color: rgba(255,255,255,0.15); background: var(--bg3); }
.signal-card.active { border-color: rgba(245,188,66,0.5); background: var(--bg3); }
.sig-top { display: flex; align-items: flex-start; gap: 12px; }
.sig-icon { width: 36px; height: 36px; border-radius: var(--radius); background: var(--bg); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
.sig-content { flex: 1; min-width: 0; }
.sig-meta { font-size: 10px; color: var(--fg2); display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.sig-meta .sig-type { font-weight: 600; color: var(--fg); }
.sig-desc { font-size: 12px; color: rgba(240,242,255,0.9); margin-top: 5px; line-height: 1.55; }
.sig-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; gap: 8px; }
.sig-badges { display: flex; align-items: center; gap: 5px; }
.badge-risk { background: var(--risk-light); color: var(--risk); font-size: 10px; padding: 1px 6px; border-radius: 4px; font-weight: 500; }
.badge-opp { background: var(--opp-light); color: var(--opp); font-size: 10px; padding: 1px 6px; border-radius: 4px; font-weight: 500; }
.badge-urgency { font-size: 10px; padding: 1px 6px; border-radius: 4px; border: 1px solid; font-weight: 500; }
.badge-urg-h { color: var(--urg-h); border-color: rgba(224,85,85,0.4); background: rgba(224,85,85,0.1); }
.badge-urg-m { color: var(--urg-m); border-color: rgba(245,188,66,0.4); background: rgba(245,188,66,0.1); }
.badge-urg-l { color: var(--urg-l); border-color: rgba(90,106,153,0.4); background: rgba(90,106,153,0.1); }
.sig-actions { display: flex; align-items: center; gap: 5px; }
.outreach-btn { font-size: 10px; padding: 4px 10px; border-radius: var(--radius); border: 1px solid var(--border); color: var(--fg2); transition: all 0.15s; }
.outreach-btn:hover { color: var(--primary); border-color: rgba(245,188,66,0.5); }
.checkbox-wrap { display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--fg2); }
.checkbox-wrap input[type=checkbox] { cursor: pointer; accent-color: var(--primary); }
.feed-empty { text-align: center; color: var(--fg2); padding: 48px 0; font-size: 13px; }
.multi-btn-row { padding: 10px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; }
.multi-btn { font-size: 12px; padding: 6px 14px; border-radius: var(--radius); background: var(--primary); color: var(--primary-fg); font-weight: 600; transition: opacity 0.15s; }
.multi-btn:hover { opacity: 0.85; }

/* Contract bar */
.contract-bar-wrap { margin-top: 12px; }
.contract-header { display: flex; justify-content: space-between; align-items: center; font-size: 10px; color: var(--fg2); margin-bottom: 4px; }
.contract-bar { height: 4px; background: var(--bg3); border-radius: 2px; overflow: hidden; }
.contract-fill { height: 100%; border-radius: 2px; transition: width 0.4s; }
.contract-fill.pace-ok { background: var(--opp); }
.contract-fill.pace-warn { background: var(--urg-m); }
.contract-fill.pace-risk { background: var(--risk); }
.contract-renewal { font-size: 10px; color: var(--fg2); margin-top: 3px; }

/* Empty state */
.empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--fg2); gap: 8px; }
.empty-logo { width: 48px; height: 48px; border-radius: 12px; background: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 24px; color: var(--primary-fg); }
.empty-title { font-size: 15px; font-weight: 600; color: var(--fg); }
.empty-sub { font-size: 13px; }

/* Right panel */
.panel { width: 380px; min-width: 380px; background: var(--bg2); border-left: 1px solid var(--border); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
.panel-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.panel-title-sub { font-size: 11px; color: var(--fg2); }
.panel-title { font-size: 13px; font-weight: 600; }
.panel-actions { display: flex; align-items: center; gap: 2px; }
.icon-btn { width: 28px; height: 28px; border-radius: var(--radius); display: flex; align-items: center; justify-content: center; color: var(--fg2); transition: all 0.15s; font-size: 14px; }
.icon-btn:hover { color: var(--fg); background: var(--bg3); }
.panel-body { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 20px; }

/* Outreach panel sections */
.section-title-row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.section-icon { font-size: 12px; color: var(--primary); }
.section-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; color: var(--fg2); }
.signal-preview { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; }
.signal-preview-meta { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--fg2); margin-bottom: 4px; }
.signal-preview-meta strong { color: var(--fg); }
.signal-preview p { font-size: 11px; color: rgba(240,242,255,0.8); line-height: 1.5; }
.angle-text { font-size: 12px; line-height: 1.6; color: rgba(240,242,255,0.9); }
.email-field-label { font-size: 10px; color: var(--fg2); margin-bottom: 4px; }
.email-input { width: 100%; background: transparent; font-size: 12px; border: 0; border-bottom: 1px solid transparent; padding: 4px 0; transition: border-color 0.15s; }
.email-input:focus { border-bottom-color: rgba(245,188,66,0.5); outline: none; }
.email-body { width: 100%; background: transparent; font-size: 11px; line-height: 1.6; border: 1px solid transparent; border-radius: var(--radius); padding: 8px; resize: none; transition: border-color 0.15s; min-height: 180px; white-space: pre-wrap; }
.email-body:focus { border-color: rgba(245,188,66,0.5); outline: none; }
.email-field-label { margin-top: 10px; }
.email-field-label:first-child { margin-top: 0; }
.btn-row { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.btn-primary { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 8px 16px; border-radius: var(--radius); background: var(--primary); color: var(--primary-fg); transition: opacity 0.15s; text-decoration: none; }
.btn-primary:hover { opacity: 0.85; }
.btn-secondary { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; font-weight: 500; padding: 7px 16px; border-radius: var(--radius); border: 1px solid var(--border); color: var(--fg); transition: all 0.15s; }
.btn-secondary:hover { border-color: rgba(245,188,66,0.5); color: var(--primary); }
.talking-pts { list-style: none; display: flex; flex-direction: column; gap: 6px; }
.talking-pts li { display: flex; gap: 8px; font-size: 12px; line-height: 1.55; color: rgba(240,242,255,0.9); }
.talking-pts li .dot { color: var(--primary); margin-top: 1px; flex-shrink: 0; }
.value-props { list-style: none; display: flex; flex-direction: column; gap: 5px; }
.value-props li { display: flex; gap: 6px; font-size: 11px; color: var(--fg2); line-height: 1.5; }
.value-props li .arrow { color: var(--primary); flex-shrink: 0; }

/* Intel panel */
.poc-card { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.poc-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.poc-name { font-size: 13px; font-weight: 600; }
.poc-role { font-size: 11px; color: var(--fg2); margin-top: 1px; }
.poc-tenure { font-size: 10px; color: var(--fg2); }
.sentiment-badge { font-size: 10px; padding: 2px 8px; border-radius: 4px; border: 1px solid; font-weight: 500; flex-shrink: 0; }
.sentiment-warm { color: #3dba7e; border-color: rgba(61,186,126,0.3); background: rgba(61,186,126,0.1); }
.sentiment-neutral { color: var(--fg2); border-color: var(--border); background: rgba(255,255,255,0.04); }
.sentiment-cooling { color: #f5bc42; border-color: rgba(245,188,66,0.3); background: rgba(245,188,66,0.1); }
.poc-lines { display: flex; flex-direction: column; gap: 5px; font-size: 11px; line-height: 1.5; }
.poc-line { color: rgba(240,242,255,0.8); }
.poc-line strong { color: var(--fg); }
.poc-quote { border-left: 2px solid rgba(245,188,66,0.5); padding: 3px 8px; font-style: italic; color: rgba(240,242,255,0.85); font-size: 11px; }
.dynamics-box { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; font-size: 11px; line-height: 1.6; color: rgba(240,242,255,0.85); }
.integration-row { display: flex; align-items: center; justify-content: space-between; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 12px; }
.int-left { display: flex; align-items: center; gap: 8px; }
.int-name { font-size: 12px; font-weight: 500; }
.int-sync { font-size: 10px; color: var(--fg2); }
.int-connected { font-size: 10px; padding: 2px 8px; border-radius: 4px; border: 1px solid rgba(61,186,126,0.4); background: rgba(61,186,126,0.1); color: #3dba7e; font-weight: 500; }
.intel-section-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--fg2); font-weight: 600; margin-bottom: 8px; }
.intel-section { display: flex; flex-direction: column; gap: 8px; }

/* Scrollbar for panel */
.panel-body::-webkit-scrollbar { width: 3px; }
.panel-body::-webkit-scrollbar-thumb { background: #333; }

/* Fade-in */
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.fade-in { animation: fadeIn 0.15s ease-out; }

/* Intel header button */
.intel-btn { font-size: 11px; padding: 4px 12px; border-radius: var(--radius); border: 1px solid var(--border); color: var(--fg2); transition: all 0.15s; display: flex; align-items: center; gap: 4px; }
.intel-btn:hover { color: var(--fg); background: var(--bg2); }
.intel-btn.active { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
</style>
</head>

<div id="root"></div>
<script>

function timeAgo(iso) {
  const diff = Date.now() - new Date(iso).getTime();
  const d = Math.floor(diff / 86400000);
  if (d === 0) { const h = Math.floor(diff / 3600000); return h <= 1 ? "just now" : h + "h ago"; }
  if (d === 1) return "yesterday";
  if (d < 7) return d + "d ago";
  if (d < 30) return Math.floor(d/7) + "w ago";
  return Math.floor(d/30) + "mo ago";
}

function fmtCurrency(n) {
  if (n >= 1e6) return "$" + (n/1e6).toFixed(1) + "M";
  if (n >= 1000) return "$" + (n/1000).toFixed(0) + "K";
  return "$" + n;
}

function firstName(full) {
  return full.replace(/^(Dr\.|Col\.)\s+/, "").split(" ")[0];
}

function urgencyClass(u) {
  return u === "High" ? "badge-urg-h" : u === "Medium" ? "badge-urg-m" : "badge-urg-l";
}

function initials(name) {
  return name.split(" ").map(w => w[0]).slice(0,2).join("");
}

    Usage: `Hi ${fn},\n\nWanted to flag what we're seeing on the ${account.name} workstream: ${signal.description}\n\nI'd like to walk you through a concrete remediation plan and, separately, a couple of adjacent workstreams where we think we can move the needle. Can we grab 30 minutes this week?\n\n${CALENDAR}\n\nBest,\n[Your name]\nAQ`,
    Relationship: `Hi ${fn},\n\nWanted to reconnect — it's been a few weeks since we synced, and I want to make sure we're still aligned on what's most valuable to the ${account.name} team going into the next quarter.\n\nI have a short readout on workstream quality and a couple of expansion ideas. Could we grab 25 minutes this week?\n\n${CALENDAR}\n\nBest,\n[Your name]\nAQ`,
    Competitor: `Hi ${fn},\n\nYou probably saw this already — ${signal.description} Wanted to reach out proactively.\n\nWe've run head-to-head data-quality benchmarks for labs in similar situations and have a clear point of view on where AQ's SME pools differentiate. Happy to share the benchmark methodology + initial read.\n\nWorth 20 minutes?\n\n${CALENDAR}\n\nBest,\n[Your name]\nAQ`,
  };
  return bodies[t] || bodies.Usage;
}

function genTalkingPoints(account, signal) {
  const t = signal.type;
  if (t === "Funding") return [`Reference the raise and tie it to a concrete throughput target for ${account.name}'s next model release.`,"Offer a 14-day pod stand-up with named SMEs in their domain.","Propose reserved-capacity pricing locked at pre-growth rates.","Share 2 frontier-lab case studies with similar post-raise ramps.","Ask: who owns the training data buy decision now that headcount is expanding?"];
  if (t === "Press") return [`Congratulate on the launch; mirror the specific capability they shipped.`,"Propose a post-launch eval suite scoped to the new capability.","Identify 1–2 data gaps that typically show up 30–60 days after a launch like this.","Offer a 2-week pilot with a domain SME pod.","Ask about the v-next roadmap and where they expect the data bottleneck."];
  if (t === "Research") return ["Cite the paper specifically and the bottleneck it surfaces.",`Map AQ SME pools to the exact domain (${account.description.toLowerCase()}).`,"Offer a small paid pilot dataset matched to the benchmark in the paper.","Walk through reasoning-trace and preference-data methodology.","Ask if they're planning a follow-up — and whether data is on the critical path."];
  if (t === "Hiring") return [`Reference the specific roles posted at ${account.name}.`,"Frame AQ as the 'buy' option vs the 6-month internal build.","Offer to bridge: deliver throughput now, transition to internal team later.","Share metrics: time-to-first-batch, SME ramp time, quality benchmarks.","Ask whether the Head of Data role is filled yet — and who is making vendor decisions in the interim."];
  if (t === "Usage") return [`Open with transparency: own the signal (${signal.description.split(".")[0]}).`,"Present a concrete 2-week remediation plan with named quality lead.","Quantify expected impact on TAT, rejection rate, and throughput.","Pivot to adjacent workstream expansion before the renewal conversation.","Confirm renewal timeline and surface any blockers early."];
  if (t === "Relationship") return ["Acknowledge the silence without making it awkward.","Surface 1 concrete win from the last 30 days of work.","Re-introduce AQ to any new stakeholders.",`Propose a refreshed cadence (monthly QBR + weekly ops).`,"Ask what success looks like for " + account.name + " in the next quarter."];
  return ["Acknowledge the competitor move without disparaging.","Offer a head-to-head data-quality benchmark with clear methodology.","Lean on AQ's differentiated SME pools (PhD, cleared, niche domain).","Share a case study where we won a similar bake-off.","Ask which capability they feel most exposed on — and offer a 2-week proof."];
}

function generateOutreach(account, signal, allSignals) {
  return { angle: genAngle(account, signal, allSignals), emailSubject: genSubject(account, signal), emailBody: genBody(account, signal), talkingPoints: genTalkingPoints(account, signal), valueProps: VALUE_PROPS[signal.type] };
}

function generateMultiOutreach(account, sigs) {
  if (!sigs || !sigs.length) return null;
  if (sigs.length === 1) return generateOutreach(account, sigs[0]);
  const types = [...new Set(sigs.map(s => s.type))];
  const hasRisk = sigs.some(s => s.classification === "Risk");
  const hasFunding = types.includes("Funding"), hasUsage = types.includes("Usage"), hasHiring = types.includes("Hiring"), hasPress = types.includes("Press"), hasRelationship = types.includes("Relationship");
  let lead;
  if (hasFunding && hasUsage) lead = account.name + " has fresh capital landing at the same moment their existing workstreams are hitting contracted ceilings — budget capacity and immediate data need are aligned in a way that rarely lines up this cleanly.";
  else if (hasFunding && hasHiring) lead = account.name + " is deploying fresh capital straight into a data-org build — the buy-vs-build decision is live right now, and the window to be the 'buy' is measured in weeks, not quarters.";
  else if (hasUsage && hasRisk) lead = "Workstream health at " + account.name + " is degrading at the same time other signals are stacking up — this is a save motion first and an expansion conversation second, and the order matters.";
  else if (hasPress && hasHiring) lead = account.name + " just shipped publicly and is staffing up to sustain the momentum — they need v-next data and eval coverage faster than they can build the team to produce it.";
  else if (hasRelationship && hasRisk) lead = "Relationship signals at " + account.name + " are trending the wrong way alongside operational ones — re-anchoring with the right stakeholders has to happen before any commercial conversation lands.";
  else lead = "Multiple independent signals at " + account.name + " are converging on the same underlying story — their data needs are growing faster than their internal capacity to meet them.";
  const pitch = hasRisk && !hasFunding ? "The pitch is a credible remediation plan paired with a clear path to expansion once trust is rebuilt — not a new SOW." : hasFunding || hasPress ? "The pitch is straightforward: AQ can scale with them right now, across the workstreams that are already proving out, without the six-month internal ramp." : hasHiring ? "The pitch is the 'buy' option — an instrumented pod in two weeks while their incoming hires focus on strategy instead of ops." : "The pitch is a single coordinated engagement across these threads rather than chasing each one separately.";
  const angle = lead + " " + pitch;
  const bullets = sigs.map(s => "• " + s.type + ": " + s.description.replace(/\.$/, "")).join("\n");
  const emailBody = `Hi ${firstName(account.contactName)},\n\nA handful of signals on the ${account.name} side have stacked up over the last few weeks, and I wanted to put them in front of you together rather than in separate threads:\n\n${bullets}\n\nIndividually, any one of these is worth a conversation. Together, they suggest a clear window for AQ to step in with a coordinated plan — SME-vetted annotator pods, tailored eval coverage, and a single point of contact across workstreams.\n\nWorth a 25-minute walkthrough next week?\n\n${CALENDAR}\n\nBest,\n[Your name]\nAQ`;
  return { angle, emailSubject: "A few things on our radar for " + account.name, emailBody, talkingPoints: ["Open by naming the pattern: " + types.join(", ") + " signals all landing in the same window.","Walk through each signal briefly and connect it to a concrete AQ motion.","Propose one coordinated plan rather than " + sigs.length + " separate workstreams.","Identify the single decision-maker who can greenlight a combined engagement.","Close on a 2-week pilot scoped to the highest-urgency signal."], valueProps: [...new Set(types.flatMap(t => (VALUE_PROPS[t] || []).slice(0,1)))] };
}

function bestSignal(account, sigs) {
  if (!sigs.length) return null;
  const rank = { High:3, Medium:2, Low:1 };
  return [...sigs].sort((a,b) => (rank[b.urgency]-rank[a.urgency]) || new Date(b.timestamp)-new Date(a.timestamp))[0];
}

  if (!account.contractCeiling || !account.contractValue) return null;

      ),
      h("div", null,
        h("div", { className:"intel-section-label" }, "Connected data sources"),
        h("p", { style:{fontSize:"11px",color:"var(--fg2)",marginBottom:"8px"} }, "POC profiles are automatically enriched from your connected tools."),
        h("div", { style:{display:"flex",flexDirection:"column",gap:"6px"} },
          INTEGRATIONS.map(i => h("div", { key:i.name, className:"integration-row" },
            h("div", { className:"int-left" },
              h("span", { style:{fontSize:"16px"} }, i.emoji),
              h("div", null, h("div", { className:"int-name" }, i.name), h("div", { className:"int-sync" }, "Last synced: " + i.lastSynced))
            ),
            h("span", { className:"int-connected" }, "Connected ✓")
          ))
        )
      )
    )
  );
}

// ── ROOT ──────────────────────────────────────────────────────────────────────
function App() {
  const [selectedId, setSelectedId] = useState(null);
  const [panel, setPanel] = useState(null); // null | { kind:"outreach", signal?, multiSignals? } | { kind:"intel" }

  const account = useMemo(() => accounts.find(a => a.id === selectedId), [selectedId]);
  const accountSignals = useMemo(() => selectedId ? signals.filter(s => s.accountId === selectedId) : [], [selectedId]);
  const activeSignal = panel?.kind === "outreach" && panel.signalId ? signals.find(s => s.id === panel.signalId) : undefined;
  const multiSignals = panel?.kind === "outreach" && panel.multiIds ? panel.multiIds.map(id => signals.find(s => s.id === id)).filter(Boolean) : undefined;

  const handleSelect = (id) => {
    if (id === selectedId) { setSelectedId(null); setPanel(null); return; }
    setSelectedId(id);
    setPanel(null);
  };

  return h("div", { className:"app" },
    h(AccountSidebar, { selectedId, onSelect:handleSelect }),
    account
      ? h(SignalFeed, {
          account,
          activePanelKind: panel?.kind,
          onGenerate: (sig) => setPanel({ kind:"outreach", signalId:sig.id }),
          onGenerateMulti: (sigs) => setPanel({ kind:"outreach", multiIds:sigs.map(s=>s.id) }),
          onOpenIntel: () => setPanel(p => p?.kind==="intel" ? null : { kind:"intel" }),
        })
      : h("div", { className:"empty-state" },
          h("div", { className:"empty-logo" }, "✦"),
          h("div", { className:"empty-title" }, "AQ Account Pulse"),
          h("div", { className:"empty-sub" }, "Select an account to view signals.")
        ),
    panel && account && (
      panel.kind === "outreach"
        ? h(OutreachPanel, { account, signal:activeSignal, multiSignals, accountSignals, onClose:()=>setPanel(null) })
        : panel.kind === "intel"
        ? h(IntelPanel, { account, onClose:()=>setPanel(null) })
        : null
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
